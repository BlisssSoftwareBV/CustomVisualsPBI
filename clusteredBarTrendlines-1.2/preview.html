<!doctype html>
<html lang="nl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forecast order intake 1.2</title>
    <style>
        :root { font-family: "Segoe UI", sans-serif; color: #323130; background: #f4f5f6; }
        * { box-sizing: border-box; }
        body { margin: 0; letter-spacing: 0; }
        header { padding: 20px 24px 12px; border-bottom: 1px solid #d6d8dc; background: white; }
        h1 { font-size: 20px; font-weight: 600; margin: 0 0 16px; }
        h1 small { font-size: 12px; font-weight: 400; color: #666; }
        .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
        label { display: flex; align-items: center; gap: 8px; font-size: 12px; }
        select { font: inherit; padding: 6px; max-width: 230px; border: 1px solid #aaa; border-radius: 3px; background: white; }
        input[type="color"] { width: 32px; height: 28px; border: 0; padding: 0; background: transparent; }
        input[type="range"] { width: 100px; accent-color: #118dff; }
        main { margin: 20px 24px; background: white; min-height: 440px; height: calc(100dvh - 165px); }
        @media (max-width: 600px) { header { padding: 16px; } h1 { font-size: 18px; } main { margin: 12px; height: 500px; } }
    </style>
</head>
<body>
    <header>
        <h1>Forecast order intake <small>1.2</small></h1>
        <div class="controls">
            <label>Trendlijn <select id="type">
                <option value="linear">Lineair</option><option value="exponential">Exponentieel</option>
                <option value="logarithmic">Logaritmisch</option><option value="polynomial">Polynomiaal</option>
                <option value="power">Macht</option><option value="movingAverage">Voortschrijdend gemiddelde</option>
            </select></label>
            <label>Lijnkleur <input id="lineColor" type="color" value="#173f73"></label>
            <label>Lijndikte <input id="lineWidth" type="range" min="1" max="8" step="0.5" value="3"></label>
            <label>Kolomkleur <input id="columnColor" type="color" value="#173f73"></label>
            <label><input id="labels" type="checkbox" checked> Gegevenslabels</label>
            <label><input id="dashed" type="checkbox"> Gestreepte lijn</label>
        </div>
    </header>
    <main id="visual"></main>
    <script type="module">
        import { Visual } from "/src/visual.ts";
        const element = document.getElementById("visual");
        let selected = [];
        const identity = key => ({ getKey: () => key, getSelector: () => ({ metadata: key }), includes: other => other.getKey() === key });
        const failures = [];
        const host = {
            locale: "nl-NL",
            colorPalette: { isHighContrast: false, foreground: { value: "#000000" }, background: { value: "#ffffff" },
                getColor: () => ({ value: "#173f73" }) },
            createSelectionManager: () => ({ registerOnSelectCallback() {}, getSelectionIds: () => selected,
                select: async (id, multi) => { selected = multi ? [...selected, id] : [id]; return selected; },
                clear: async () => { selected = []; return selected; }, showContextMenu: async () => {} }),
            createSelectionIdBuilder: () => {
                let key = "";
                const builder = { withMeasure: measure => { key += measure; return builder; },
                    withCategory: (category, index) => { key += `:${index}`; return builder; },
                    withSeries: () => builder, createSelectionId: () => identity(key) };
                return builder;
            },
            eventService: { renderingStarted() {}, renderingFinished() {}, renderingFailed: (options, message) => failures.push(message) },
            tooltipService: { show() {}, hide() {} }
        };
        const visual = new Visual({ element, host });
        const measures = [
            { source: { displayName: "ForecastOrderIntake", queryName: "forecast", roles: { value: true }, format: "\u20ac #,0" }, values: [57e6, 130e6, 130e6, 154e6, 183e6] }
        ];
        measures.grouped = () => [{ values: measures }];
        const view = { metadata: { columns: measures.map(measure => measure.source), objects: {} }, categorical: {
            categories: [{ source: { displayName: "Jaar", roles: { category: true } }, values: ["2026", "2028", "2027", "2029", "2030"] }], values: measures } };
        function update() {
            view.metadata.objects = {
                trend: { type: document.getElementById("type").value },
                labelStyle: { show: document.getElementById("labels").checked }
            };
            measures[0].source.objects = {
                seriesStyle: { color: { solid: { color: document.getElementById("columnColor").value } } },
                trendStyle: { color: { solid: { color: document.getElementById("lineColor").value } }, useDefaultStroke: false,
                    width: Number(document.getElementById("lineWidth").value), dashed: document.getElementById("dashed").checked }
            };
            redraw();
        }
        function redraw() { visual.update({ viewport: { width: element.clientWidth, height: element.clientHeight }, dataViews: [view], type: 2 }); }
        document.querySelectorAll(".controls input, .controls select").forEach(control => control.addEventListener("input", update));
        new ResizeObserver(redraw).observe(element);
        window.preview = { visual, view, host, failures, redraw };
        update();
    </script>
</body>
</html>
